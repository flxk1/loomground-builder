name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test                    # skill/sheet/gate.mjs — twin-sheet/1 contract
      - run: npm run test:backend:all     # backend-from-model gate, four reference sources
      - run: npm run test:security        # adapter-loading security tests
